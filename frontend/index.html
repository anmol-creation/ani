<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.ac Personal AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Optional Sidebar for Future Expansion -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>.ac Ecosystem</h2>
                <span id="status-indicator" class="status offline" title="Backend Status"></span>
            </div>
            <div class="sidebar-content">
                <p class="nav-item active">New Chat</p>
                <!-- History items will go here later -->
            </div>
            <div class="sidebar-footer">
                <p>⚙️ Settings</p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-history" id="chat-history">
                <div class="message ai-message">
                    <div class="message-content">
                        Hello! I am your `.ac` Personal AI Assistant. I am running locally. How can I help you today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Type a message... (Shift+Enter for new line)" rows="1"></textarea>
                    <button id="send-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="input-footer">
                    100% Local AI • Privacy Focused
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
